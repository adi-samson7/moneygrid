<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#070813" />
    <script>
      // Apply the saved theme before the page paints, so dark mode does not flash white.
      try {
        var t = localStorage.getItem('moneygrid-theme')
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Money Grid: track subscriptions, insurance policies, payments and renewals in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Money Grid" />
    <meta property="og:description" content="Track subscriptions, insurance policies, payments and renewals in one place." />
    <meta property="og:image" content="https://moneygrid-xi.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money Grid</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
